services:
  db-init:
    build:
      context: .
      target: db-init
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    restart: "no"

  app:
    build:
      context: .
      target: runner
    container_name: uscloserscom-order
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    expose:
      - "3000"
    volumes:
      - /opt/usclosers.com/order/public/images:/app/public/images:ro
      - /opt/usclosers.com/order/public/solutions:/app/public/solutions:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - default
      - npm_default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok&&r.status!==307&&r.status!==308)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  npm_default:
    external: true
